@switch (selectedNavbar()) {
  @case ('top') {
    <navbar-top></navbar-top>
  }
  @case ('megamenu') {
    <mega-menu></mega-menu>
  }
  @case ('bubble') {
    <navbar-bubble></navbar-bubble>
  }
  @case ('floating') {
    <floating-menu></floating-menu>
  }
}
<form class="max-w-sm mx-auto mt-50 text-gray-900 dark:text-gray-100">
  <label for="countries" class="block mb-2.5 text-sm font-medium text-heading"
    >Select an option <em class="font-light">({{ selectedNavbar() }})</em></label
  >
  <select
    id="countries"
    class="block w-full px-3 py-2.5 bg-blue-100 dark:bg-blue-900 border rounded-xl text-sm hover:dark:bg-blue-950 hover:bg-blue-200 hover:cursor-pointer transition duration-200"
    (change)="onNavbarTypeSelected($event)"
  >
    <option selected class="" value="top">Top Navbar (default)</option>
    <option class="" value="bubble">Bubble navbar</option>
    <option class="" value="megamenu">Mega-menu</option>
    <option class="" value="floating">Floating-menu</option>
  </select>
</form>

<hr class="my-3" />
<form class="max-w-sm mx-auto text-gray-900 dark:text-gray-100">
  <label for="countries" class="block mb-2.5 text-sm font-medium text-heading"
    >Select table content type</label
  >
  <select
    id="countries"
    class="block w-full px-3 py-2.5 bg-blue-100 dark:bg-blue-900 border rounded-xl text-sm hover:dark:bg-blue-950 hover:bg-blue-200 hover:cursor-pointer transition duration-200"
    (change)="onTableContentTypeSelected($event)"
  >
    <option selected class="" value="users">Users</option>
    <option class="" value="books">Books</option>
  </select>
</form>

<app-table
  [tableName]="selectedMockedData() === 'users' ? 'User Table' : 'Books table'"
  [tableData]="tableInputData()"
  [paginatorVal]="currentItemPerPage()"
  [cols]="columnNames()"
  [colWidthRatio]="selectedMockedData() === 'users' ? [1, 1, 1, 2, 1, 6] : [1, 2, 1, 1, 4]"
  [numberOfPages]="calculatedNumberOfPages()"
  [curentpage]="currentPage()"
  (onItemClicked)="itemSelectedFromTable($event)"
  (onPaginationChanched)="paginatorChangedFromTable($event)"
  (onPageChanged)="pageChanged($event)"
></app-table>
